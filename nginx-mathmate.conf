server {
    resolver 8.8.8.8 114.114.114.114 valid=300s ipv6=off;
    server_name mathmate.top www.mathmate.top 47.94.83.150;
    root /var/www/mathmate;
    index index.html;

    # ===== Bilibili 代理 =====
    location ~ ^/api/bilibili/img/([^/]+)/(.*)$ {
        proxy_pass https://$1/$2;
        proxy_ssl_server_name on;
        proxy_set_header Host $1;
        proxy_set_header Referer "https://www.bilibili.com/";
    }

    location /api/bilibili/ {
        proxy_pass https://api.bilibili.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.bilibili.com;
        proxy_set_header Referer "https://www.bilibili.com/";
    }

    # ===== 认证服务 =====
    location /api/auth/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== MathMate API 代理 =====
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== GeoGebra Chat =====
    location ^~ /geogebra-chat/_next/static/ {
        alias /opt/geogebra-chat/.next/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /geogebra-chat/css/ {
        alias /opt/geogebra-chat/public/css/;
    }
    location /geogebra-chat/favicon.ico {
        alias /opt/geogebra-chat/public/favicon.ico;
    }
    location /geogebra-chat {
        return 302 /geogebra-chat/;
    }
    location /geogebra-chat/ {
        proxy_pass http://127.0.0.1:3003/geogebra-chat/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # ===== Flutter Web 应用 (新增) =====
    location = /app {
        return 301 /app/;
    }
    # APK 必须是实际文件，禁止不存在的下载地址回退到 Flutter index.html。
    location ~ ^/app/.*\.apk$ {
        try_files $uri =404;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
    }
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location = /tech {
        return 301 /tech.html;
    }

    # ===== 官网主页 (根目录) =====
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 静态资源缓存 =====
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|wasm|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mathmate.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mathmate.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = www.mathmate.top) {
        return 301 https://$host$request_uri;
    }
    if ($host = mathmate.top) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name mathmate.top www.mathmate.top 47.94.83.150;
    return 404;
}
