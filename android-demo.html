<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="在浏览器中直接体验 MathMate Android 云端版本。">
  <title>MathMate Android 云端体验</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <style>
    :root {
      --bg: #0b1115;
      --surface: #111a20;
      --line: #263840;
      --text: #eef8f7;
      --muted: #9bb0b2;
      --primary: #4ed8d1;
      --accent: #f2c14e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    header {
      min-height: 64px; padding: 10px clamp(16px, 4vw, 40px);
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      border-bottom: 1px solid var(--line); background: rgba(11, 17, 21, 0.94);
    }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 800; }
    .brand img { width: 34px; height: 34px; border-radius: 7px; }
    .actions { display: flex; align-items: center; gap: 10px; }
    .status { color: var(--muted); font-size: 13px; }
    .status::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: var(--primary); }
    .back {
      display: inline-flex; align-items: center; min-height: 38px; padding: 0 14px;
      border: 1px solid var(--line); border-radius: 6px; color: var(--text); text-decoration: none; font-size: 14px;
    }
    main {
      min-height: calc(100vh - 64px); padding: 18px;
      display: grid; place-items: center; overflow: hidden;
    }
    .emulator {
      width: min(100%, 1120px); height: calc(100vh - 100px); min-height: 620px;
      border: 1px solid var(--line); background: var(--surface); overflow: hidden;
    }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    @media (max-width: 640px) {
      header { min-height: 56px; }
      .status { display: none; }
      main { min-height: calc(100vh - 56px); padding: 0; }
      .emulator { width: 100%; height: calc(100vh - 56px); min-height: 0; border: 0; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/"><img src="/icon.png" alt=""><span>MathMate Android</span></a>
    <div class="actions"><span class="status">云端设备</span><a class="back" href="/">返回首页</a></div>
  </header>
  <main>
    <div class="emulator">
      <iframe
        title="MathMate Android 云端设备"
        src="https://appetize.io/embed/__APPETIZE_BUILD_ID__?device=pixel4&amp;scale=auto&amp;centered=both&amp;orientation=portrait&amp;grantPermissions=true"
        allow="clipboard-read; clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>
  </main>
</body>
</html>
